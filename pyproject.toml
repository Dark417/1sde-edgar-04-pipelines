[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "edgar-pipelines"
version = "0.1.0"
description = "EDGAR lakehouse medallion pipelines: landing -> bronze -> silver -> gold -> serving export"
readme = "README.md"
# Serverless runs Python 3.12 (/databricks/python3/lib/python3.12/site-packages). This
# was pinned to "==3.11.*", which made the wheel refuse to install on the only compute
# this project has: ERROR_UNSUPPORTED_PYTHON_VERSION, at library-install time, before a
# line of pipeline code ran. Local tests and CI both pass on 3.11, so nothing caught it
# until the first real deploy.
#
# The upper bound stays: 3.13 is untested against this Spark/Delta pair, and an
# unbounded range would move the failure from install time to runtime.
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Dark417" }]

# Runtime deps only. PySpark/Delta are provided by the Databricks serverless runtime
# and are therefore NOT runtime dependencies of the wheel -- installing pyspark into a
# Databricks job shadows the runtime build and is a known source of subtle breakage.
dependencies = [
  "boto3>=1.34",
  # RUNTIME, not dev: the mirror is gone, so the Databricks job imports this package at
  # execution time. It is not on PyPI, so serverless cannot resolve it from an index --
  # the bundle ships the wheel in dist/ and lists it in environments.dependencies.
  "edgar-lakehouse-contracts==1.4.0",
]

[project.optional-dependencies]
# Local development: the Spark/Delta versions that approximate the serverless runtime,
# plus the tooling needed to fetch a test subset of EDGAR without repo 3.

dev = [
  "pyspark==4.0.1",
  "delta-spark==4.0.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "requests>=2.31",
  "types-requests",
  "pandas>=2.2",
  "pyarrow>=16.0",
]

[project.scripts]
edgar-pipelines = "pipelines.entrypoints.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "spark: test requires a local SparkSession with Delta (slow)",
  "network: test reaches the public SEC EDGAR API (skipped by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF"]
ignore = [
  # Long SQL string literals and contract tables are more readable unwrapped.
  "E501",
  # `from pyspark.sql import functions as F` is the universal Spark convention; the
  # alternative is either `pyspark_functions.` on every call or a wildcard import.
  "N812",
  # StrEnum would drop Python 3.10 compatibility for the contracts package, which is
  # the one part of this repo other tooling may end up importing.
  "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# DQBatchFailure is named by the specification (AGENTS.md F-3, "Raises DQBatchFailure
# on reject_batch"). Renaming it to satisfy a lint convention would break the contract
# the docs describe.
"src/pipelines/framework/dq.py" = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

# Spark modules are excluded from --strict: pyspark's own stubs are incomplete and
# every DataFrame op degenerates to Any, which makes strict mode noise rather than
# signal. Non-Spark modules (config, contracts, names, concepts) are fully checked.
[[tool.mypy.overrides]]
module = [
  "pipelines.framework.autoloader",
  "pipelines.framework.dq",
  "pipelines.framework.merge",
  "pipelines.framework.metrics",
  "pipelines.framework.preflight",
  "pipelines.bronze.*",
  "pipelines.silver.*",
  "pipelines.gold.*",
  "pipelines.export.*",
  "pipelines.entrypoints.*",
  "pipelines.session",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "boto3.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/pipelines"]
omit = ["src/pipelines/entrypoints/*", "src/pipelines/session.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
