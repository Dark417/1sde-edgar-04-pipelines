# Databricks Asset Bundle (feature F-11).
#
# This bundle owns the job outright -- the resource, the task graph, the wheel version
# and the schedule. Repo 2 previously declared a `databricks_job.daily` as well; both
# have now been removed there and root law 2 assigns Databricks job definitions to this
# repo. Neither had ever been applied, so no job was orphaned: had they been, the two
# would not have collided or errored, they would simply both have existed and run the
# same pipeline against the same tables.
#
# The job belongs here because a job definition is not stable infrastructure. It is the
# task graph, the entrypoints and the wheel version, all of which change when this
# repo's code changes -- so owning it here keeps the job version-locked to the code it
# runs. See docs/10-decisions.md ADR-006.
#
# Two Free Edition facts shape everything below:
#   * serverless compute only -- no cluster blocks, no init scripts, no JVM libraries;
#   * a daily quota that shuts compute down for the rest of the day when exhausted.
#
# Which is why `max_concurrent_runs: 1` and why CI never runs `bundle run`. Deploying a
# definition is free; triggering a run costs quota on every merge.

bundle:
  name: edgar-pipelines

variables:
  catalog:
    description: Unity Catalog catalog the pipeline writes to.
    default: edgar
  landing_root:
    description: Landing volume path (repo 2 publishes it at /edgar-lakehouse/dbx/landing_volume).
    default: /Volumes/edgar/landing/edgar
  export_root:
    description: Serving bucket URI (repo 2 publishes it at /edgar-lakehouse/s3/serving_bucket).
    default: ""
  wheel_version:
    description: Exact wheel version. Pinned with ==, never >= and never main.
    default: 0.1.0

artifacts:
  edgar_pipelines_wheel:
    type: whl
    build: python -m build --wheel
    path: .

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    edgar_medallion:
      name: edgar-medallion-${bundle.target}

      # One run at a time. Two overlapping runs on a Free Edition quota is how you lose
      # a day -- and the second run would race the first one's MERGEs.
      max_concurrent_runs: 1

      # No retries. A failed task here means bad data or a missing migration, and
      # retrying either one burns quota to produce the same failure.
      queue:
        enabled: false

      # Owned here since repo 2 dropped its job resource. Created PAUSED, and that is
      # not a placeholder to tidy up later:
      #
      #   * an enabled schedule pointing at unproven code burns the Free Edition daily
      #     quota, and an exhausted quota shuts compute down for the rest of the day;
      #   * no run of this pipeline has ever succeeded against the workspace, so the
      #     first one should be a human watching it, not a timer at 06:00.
      #
      # Unpause deliberately, after `tools/dbx_verify` passes:
      #   databricks jobs update --json '{"schedule":{"pause_status":"UNPAUSED"}}' ...
      # or flip this to UNPAUSED and redeploy.
      #
      # 06:00 UTC: the SEC publishes the daily index the previous evening US Eastern,
      # so this lands after the file exists but before the working day starts.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: PAUSED

      parameters:
        - name: logical_date
          default: "{{job.trigger.time.iso_date}}"
        - name: catalog
          default: ${var.catalog}
        - name: environment
          default: ${bundle.target}

      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              - ./dist/*.whl

      tasks:
        # The graph is deliberately narrow: Free Edition allows at most 5 concurrent
        # job tasks, and a wide fan-out here would queue rather than parallelize.
        - task_key: bronze_ingest
          environment_key: serverless
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters: ["bronze_ingest"]

        - task_key: silver_transform
          environment_key: serverless
          depends_on:
            - task_key: bronze_ingest
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters: ["silver_transform"]

        - task_key: gold_build
          environment_key: serverless
          depends_on:
            - task_key: silver_transform
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters: ["gold_build"]

        - task_key: serving_export
          environment_key: serverless
          depends_on:
            - task_key: gold_build
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters: ["serving_export"]
