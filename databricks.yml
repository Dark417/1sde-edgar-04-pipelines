# Databricks Asset Bundle (feature F-11).
#
# This bundle owns the job outright -- the resource, the task graph, the wheel version
# and the schedule. Repo 2 previously declared a `databricks_job.daily` as well; both
# have now been removed there and root law 2 assigns Databricks job definitions to this
# repo. Neither had ever been applied, so no job was orphaned: had they been, the two
# would not have collided or errored, they would simply both have existed and run the
# same pipeline against the same tables.
#
# The job belongs here because a job definition is not stable infrastructure. It is the
# task graph, the entrypoints and the wheel version, all of which change when this
# repo's code changes -- so owning it here keeps the job version-locked to the code it
# runs. See docs/10-decisions.md ADR-006.
#
# Two Free Edition facts shape everything below:
#   * serverless compute only -- no cluster blocks, no init scripts, no JVM libraries;
#   * a daily quota that shuts compute down for the rest of the day when exhausted.
#
# Which is why `max_concurrent_runs: 1` and why CI never runs `bundle run`. Deploying a
# definition is free; triggering a run costs quota on every merge.

bundle:
  name: edgar-pipelines

variables:
  catalog:
    description: Unity Catalog catalog the pipeline writes to.
    default: edgar
  landing_root:
    description: Landing volume path (repo 2 publishes it at /edgar-lakehouse/dbx/landing_volume).
    default: /Volumes/edgar/landing/edgar
  export_root:
    description: Serving bucket URI (repo 2 publishes it at /edgar-lakehouse/s3/serving_bucket).
    default: ""
  wheel_version:
    description: Exact wheel version. Pinned with ==, never >= and never main.
    default: 0.1.0

artifacts:
  edgar_pipelines_wheel:
    type: whl
    build: python -m build --wheel
    path: .

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    edgar_medallion:
      name: edgar-medallion-${bundle.target}

      # One run at a time. Two overlapping runs on a Free Edition quota is how you lose
      # a day -- and the second run would race the first one's MERGEs.
      max_concurrent_runs: 1

      # No retries. A failed task here means bad data or a missing migration, and
      # retrying either one burns quota to produce the same failure.
      queue:
        enabled: false

      # Owned here since repo 2 dropped its job resource. Created PAUSED, and that is
      # not a placeholder to tidy up later:
      #
      #   * an enabled schedule pointing at unproven code burns the Free Edition daily
      #     quota, and an exhausted quota shuts compute down for the rest of the day;
      #   * no run of this pipeline has ever succeeded against the workspace, so the
      #     first one should be a human watching it, not a timer at 06:00.
      #
      # UNPAUSED as of the first green end-to-end run: bronze 62s, silver 116s,
      # gold 48s, serving_export 36s, all SUCCESS against logical_date 2026-07-31.
      # Repo 2's EventBridge ingest schedule is enabled to match, so the daily
      # chain runs unattended: Fargate lands the day's filings, this picks them up.
      #
      # 06:30 UTC, NOT 06:00. Repo 2's ingest schedule is cron(0 6 * * ? *) and this
      # used to be "0 0 6 * * ?" -- the same minute. Enabling both would have started
      # the pipeline while Fargate was still writing the landing zone, so a run would
      # silently process a partial day rather than fail: bronze reads whatever files
      # exist at that instant.
      #
      # There is no completion signal between the two schedules -- EventBridge cannot
      # trigger a Databricks job here -- so the gap is the only coupling. 30 minutes
      # against an ingest that takes ~90s per stream is deliberately generous; the
      # cost of being early is wrong data, the cost of being late is nothing.
      #
      # 06:00-ish overall: the SEC publishes the daily index the previous evening US
      # Eastern, so this lands after the file exists but before the working day starts.
      #
      # To pause again: flip to PAUSED and redeploy, or
      #   databricks jobs update --json '{"schedule":{"pause_status":"PAUSED"}}' ...
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED

      parameters:
        - name: logical_date
          default: "{{job.trigger.time.iso_date}}"
        - name: catalog
          default: ${var.catalog}
        - name: environment
          default: ${bundle.target}
        # Empty means "use the configured default" -- config resolves
        # env var -> SSM -> /Volumes/edgar/landing/edgar. Override it at run time to
        # point a run at the seeded fixture prefix without touching the prefix repo 3
        # owns:
        #   databricks bundle run edgar_medallion -t dev \
        #     --params landing_root=/Volumes/edgar/landing/edgar/_seed
        - name: landing_root
          default: ""
        # NOT empty, and it cannot be. config.resolve() looks this up with an SSM
        # key and no fallback default, so an empty value raises MissingConfigError
        # in bronze_ingest before any work happens -- every scheduled run would
        # fail at the first task.
        #
        # The old comment here said it "resolves via SSM in a provisioned
        # environment". It cannot: this job runs on serverless, which holds no AWS
        # credentials, so the SSM call fails no matter how well repo 2 has
        # published the parameter. Repo 2 publishing it is necessary for the
        # publish step and irrelevant to the job.
        #
        # So the job exports to the Volume, and tools/publish_serving.py moves it
        # to s3://edgar-lake-serving from somewhere that does hold credentials.
        # This must stay in step with that tool's DEFAULT_VOLUME_EXPORT.
        - name: export_root
          default: /Volumes/edgar/landing/edgar/_export

      environments:
        - environment_key: serverless
          spec:
            client: "3"
            dependencies:
              # Both wheels, installed from files. edgar-lakehouse-contracts is not on
              # PyPI, so serverless cannot resolve it from an index -- listing the file
              # is what makes a runtime dependency on repo 1 work at all.
              - ./dist/*.whl
              - ./dist/contracts/*.whl

      tasks:
        # The graph is deliberately narrow: Free Edition allows at most 5 concurrent
        # job tasks, and a wide fan-out here would queue rather than parallelize.
        - task_key: bronze_ingest
          environment_key: serverless
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters:
              - "bronze_ingest"
              - "logical_date={{job.parameters.logical_date}}"
              - "catalog={{job.parameters.catalog}}"
              - "environment={{job.parameters.environment}}"
              - "landing_root={{job.parameters.landing_root}}"
              - "export_root={{job.parameters.export_root}}"

        - task_key: silver_transform
          environment_key: serverless
          depends_on:
            - task_key: bronze_ingest
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters:
              - "silver_transform"
              - "logical_date={{job.parameters.logical_date}}"
              - "catalog={{job.parameters.catalog}}"
              - "environment={{job.parameters.environment}}"
              - "landing_root={{job.parameters.landing_root}}"
              - "export_root={{job.parameters.export_root}}"

        - task_key: gold_build
          environment_key: serverless
          depends_on:
            - task_key: silver_transform
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters:
              - "gold_build"
              - "logical_date={{job.parameters.logical_date}}"
              - "catalog={{job.parameters.catalog}}"
              - "environment={{job.parameters.environment}}"
              - "landing_root={{job.parameters.landing_root}}"
              - "export_root={{job.parameters.export_root}}"

        - task_key: serving_export
          environment_key: serverless
          depends_on:
            - task_key: gold_build
          python_wheel_task:
            package_name: edgar_pipelines
            entry_point: edgar-pipelines
            parameters:
              - "serving_export"
              - "logical_date={{job.parameters.logical_date}}"
              - "catalog={{job.parameters.catalog}}"
              - "environment={{job.parameters.environment}}"
              - "landing_root={{job.parameters.landing_root}}"
              - "export_root={{job.parameters.export_root}}"
